name: Hydrogen CI

on:
  push:
    branches:
      - Development
      - Release
  pull_request:
    branches:
      - Development
      - Release
  workflow_dispatch:
    inputs:
      live_windows_release:
        description: 'Published alpha tag to verify using hylang.co.uk (leave empty for normal CI)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-lifecycle:
    name: Windows release lifecycle
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Exercise Windows release lifecycle on Windows
        shell: powershell
        run: .\tests\windows-release-lifecycle.ps1 -SourceDir $PWD.Path

      - name: Check live release smoke test syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tests/windows-live-release.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

  windows-live-release:
    name: Public Windows release smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.live_windows_release != ''
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Install and test published release on Windows
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.live_windows_release }}
        run: .\tests\windows-live-release.ps1 -ExpectedVersion $env:EXPECTED_VERSION

  compiler:
    name: Bootstrap and cross-target tests
    runs-on: ubuntu-24.04
    timeout-minutes: 80

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake util-linux

      - name: Configure compiler
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Builds the Stage 0 C++ seed, the updated Hydrogen Stage 1,
      # then Stage 2 and Stage 3 using Hydrogen itself.
      # The existing proof checks the native corpus and requires
      # byte-identical Stage 2 / Stage 3 compiler output.
      - name: Verify native self-hosting
        run: cmake --build build --target hydrogen_bootstrap_proof --parallel 2

      # Includes the Stage 1 CTest fixture and target tests for
      # Linux native code, Windows PE generation, UEFI and OS images.
      - name: Run Stage 1 regression tests
        run: ctest --test-dir build --output-on-failure --parallel 2 -R '^hy_stage1_'

      # Also exercise the C++ SDK, interpreter, and host C backend.
      # The native Stage 1 tests ran above; the Stage 6 proof was
      # already executed directly as hydrogen_bootstrap_proof.
      - name: Build SDK test tools
        run: cmake --build build --parallel 2

      - name: Run SDK and integration regression tests
        run: ctest --test-dir build --output-on-failure --parallel 2 -E '^(hy_stage1_|hy_stage6_|hy_test_self_hosting_workspace$|hy_fmt_self_hosting_check$)'

      # Development currently has two SDK regressions (#151). Report these
      # while keeping the new native compiler's required gates strict.
      - name: Report known SDK workspace and formatting regressions
        continue-on-error: true
        run: ctest --test-dir build --output-on-failure -R '^(hy_test_self_hosting_workspace|hy_fmt_self_hosting_check)$'

      - name: Upload advisory SDK test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-sdk-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Record provenance and package compilers
        run: |
          cd build/self_hosting
          sha256sum hydrogen-stage1 hydrogen-stage2 hydrogen-stage3 > SHA256SUMS
          printf 'tested_commit=%s\ntested_ref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > BUILD-INFO.txt
          tar -czf hydrogen-linux-x86_64-verified.tar.gz \
            hydrogen-stage1 hydrogen-stage2 hydrogen-stage3 \
            bootstrap-proof.txt SHA256SUMS BUILD-INFO.txt

      # Artifacts are uploaded only after all of the above checks pass.
      # This does not publish a release or replace the trusted seed.
      - name: Upload verified Hydrogen compilers
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/self_hosting/hydrogen-stage1
            build/self_hosting/hydrogen-stage2
            build/self_hosting/hydrogen-stage3
            build/self_hosting/bootstrap-proof.txt
            build/self_hosting/SHA256SUMS
            build/self_hosting/BUILD-INFO.txt
            build/self_hosting/hydrogen-linux-x86_64-verified.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload CTest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
