name: Hydrogen CI

on:
  push:
    branches:
      - Development
      - Release
  pull_request:
    branches:
      - Development
      - Release
  workflow_dispatch:
    inputs:
      live_windows_release:
        description: 'Published alpha tag to verify using hylang.co.uk (leave empty for normal CI)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  macos-ui:
    name: AppKit UI interactions and appearance
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test dependencies
        run: |
          brew install qtbase
          python -m pip install Pillow==12.0.0
      - name: Build native AppKit test application
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release -DHYDROGEN_BUILD_UI=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase)"
          cmake --build build-ui --target hy hyui hyui_tests hyui_appkit_tests --parallel 3
      - name: Check contracts and visual comparator
        run: |
          build-ui/tools/hyui/hyui_tests expandedControlsValidateAndBind expandedResponsesAreAtomic
          python -m unittest discover -s tests/ui -p 'test_*.py'
      - name: Launch AppKit and check native interactions and reviewed screenshots
        run: python tools/hyui/ui_ci.py --platform macos --driver build-ui/tools/hyui/hyui_appkit_tests --compiler build-ui/hy --artifacts build-ui/ui-artifacts
      - name: Check sample backend integration
        run: ctest --test-dir build-ui -R '^hyui_sdk_integration$' --output-on-failure
      - name: Upload AppKit screenshots, geometry, diffs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-ui-macos-${{ github.run_id }}
          path: |
            build-ui/ui-artifacts
            build-ui/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  linux-ui:
    name: GTK UI interactions and appearance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system GTK and virtual desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtk-4-1 libadwaita-1-0 xvfb dbus-x11 fonts-dejavu-core libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install aqtinstall==3.3.0 Pillow==12.0.0
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/qt" --archives qtbase icu
      - name: Build real GTK test application
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release -DHYDROGEN_BUILD_UI=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qt/6.8.3/gcc_64"
          cmake --build build-ui --target hy hyui hyui_tests hyui_gtk_tests --parallel 3
      - name: Validate element contracts and visual comparator
        run: |
          build-ui/tools/hyui/hyui_tests
          python -m unittest discover -s tests/ui -p 'test_*.py'
      - name: Launch GTK on Xvfb and check native interactions and reviewed screenshots
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' python tools/hyui/ui_ci.py --platform linux --driver build-ui/tools/hyui/hyui_gtk_tests --compiler build-ui/hy --artifacts build-ui/ui-artifacts
      - name: Run GTK sample and packaged-app integration
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' ctest --test-dir build-ui -R '^hyui_sdk_(integration|package)$' --output-on-failure
      - name: Upload GTK screenshots, geometry, diffs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-ui-linux-${{ github.run_id }}
          path: |
            build-ui/ui-artifacts
            build-ui/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  macos-integration:
    name: macOS x64 compiler and runtime
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Bootstrap and exercise native macOS compiler
        run: bash tests/macos/integration.sh

  windows-ui:
    name: WinUI interactions and appearance
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SDK and self-contained native WinUI application
        run: |
          cmake -S . -B build-ui -DHYDROGEN_BUILD_UI=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-ui --target hy --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish tools/hyui/windows/Hyui.WinUI.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:HydrogenUiTests=true -o build-ui/native-winui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install Pillow==12.0.0
      - name: Check visual comparator
        run: python -m unittest discover -s tests/ui -p 'test_*.py'
      - name: Launch real WinUI app and check native interactions and reviewed screenshots
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          python tools/hyui/ui_ci.py --platform windows --driver build-ui/native-winui/Hyui.WinUI.exe --compiler build-ui/Release/hy.exe --artifacts build-ui/ui-artifacts
      - name: Upload WinUI screenshots, geometry, diffs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-ui-windows-${{ github.run_id }}
          path: build-ui/ui-artifacts
          if-no-files-found: warn
          retention-days: 14

  windows-lifecycle:
    name: Windows release lifecycle
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Exercise Windows release lifecycle on Windows
        shell: powershell
        run: .\tests\windows-release-lifecycle.ps1 -SourceDir $PWD.Path

      - name: Check live release smoke test syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tests/windows-live-release.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }

  windows-live-release:
    name: Public Windows release smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.live_windows_release != ''
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Install and test published release on Windows
        shell: powershell
        env:
          EXPECTED_VERSION: ${{ inputs.live_windows_release }}
        run: .\tests\windows-live-release.ps1 -ExpectedVersion $env:EXPECTED_VERSION

  compiler:
    name: Bootstrap and cross-target tests
    runs-on: ubuntu-24.04
    timeout-minutes: 80

    steps:
      - name: Check out Hydrogen source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake util-linux

      - name: Configure compiler
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Builds the Stage 0 C++ seed, the updated Hydrogen Stage 1,
      # then Stage 2 and Stage 3 using Hydrogen itself.
      # The existing proof checks the native corpus and requires
      # byte-identical Stage 2 / Stage 3 compiler output.
      - name: Verify native self-hosting
        run: cmake --build build --target hydrogen_bootstrap_proof --parallel 2

      # Includes the Stage 1 CTest fixture and target tests for
      # Linux native code, Windows PE generation, UEFI and OS images.
      - name: Run Stage 1 regression tests
        run: ctest --test-dir build --output-on-failure --parallel 2 -R '^hy_stage1_'

      # Also exercise the C++ SDK, interpreter, and host C backend.
      # The native Stage 1 tests ran above; the Stage 6 proof was
      # already executed directly as hydrogen_bootstrap_proof.
      - name: Build SDK test tools
        run: cmake --build build --parallel 2

      - name: Run SDK and integration regression tests
        run: ctest --test-dir build --output-on-failure --parallel 2 -E '^(hy_stage1_|hy_stage6_)'

      - name: Record provenance and package compilers
        run: |
          cd build/self_hosting
          sha256sum hydrogen-stage1 hydrogen-stage2 hydrogen-stage3 > SHA256SUMS
          printf 'tested_commit=%s\ntested_ref=%s\n' "$GITHUB_SHA" "$GITHUB_REF" > BUILD-INFO.txt
          tar -czf hydrogen-linux-x86_64-verified.tar.gz \
            hydrogen-stage1 hydrogen-stage2 hydrogen-stage3 \
            bootstrap-proof.txt SHA256SUMS BUILD-INFO.txt

      # Artifacts are uploaded only after all of the above checks pass.
      # This does not publish a release or replace the trusted seed.
      - name: Upload verified Hydrogen compilers
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/self_hosting/hydrogen-stage1
            build/self_hosting/hydrogen-stage2
            build/self_hosting/hydrogen-stage3
            build/self_hosting/bootstrap-proof.txt
            build/self_hosting/SHA256SUMS
            build/self_hosting/BUILD-INFO.txt
            build/self_hosting/hydrogen-linux-x86_64-verified.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload CTest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
