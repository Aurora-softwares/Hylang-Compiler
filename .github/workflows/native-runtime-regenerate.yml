name: Native runtime emitter consistency

on:
  push:
    branches: [Development, Release]
    paths:
      - tools/native-runtime/runtime.S
      - tools/native-runtime/generate.py
      - src/Hydrogen.Compiler.CodeGen.X64/NativeRuntimeEmitter.hy
      - .github/workflows/native-runtime-regenerate.yml
  pull_request:
    branches: [Development, Release]

permissions:
  contents: read

jobs:
  generated-runtime:
    name: Verify immutable-path-safe runtime bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Linux runtime byte emitter
        run: python3 tools/native-runtime/generate.py
      - name: Fail if runtime source and checked-in byte emitter differ
        run: git diff --exit-code -- src/Hydrogen.Compiler.CodeGen.X64/NativeRuntimeEmitter.hy
