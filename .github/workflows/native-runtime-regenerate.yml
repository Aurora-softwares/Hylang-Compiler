name: Regenerate Linux native runtime bytes
on:
  push:
    branches: [Development]
    paths:
      - tools/native-runtime/runtime.S
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate self-hosted Hydrogen runtime emitter
        run: python3 tools/native-runtime/generate.py
      - name: Commit generated runtime bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Hydrogen.Compiler.CodeGen.X64/NativeRuntimeEmitter.hy
          if git diff --cached --quiet; then
            echo 'Runtime emitter was already up to date.'
          else
            git commit -m 'build(native): regenerate runtime emitter after immutable path fix'
            git push origin HEAD:Development
          fi
